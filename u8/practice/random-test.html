var state={u:0,t:'a',bag:[],cur:null,last:null,shown:false,n:0,ok:0,no:0,marked:false};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pool(){return DATA.map(function(d,i){return i}).filter(function(i){var d=DATA[i];return (state.u===0||d.u===state.u)&&(state.t==='a'||d.t===state.t)})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function refill(){state.bag=shuffle(pool());if(state.bag.length>1&&state.bag[state.bag.length-1]===state.last){var t=state.bag[0];state.bag[0]=state.bag[state.bag.length-1];state.bag[state.bag.length-1]=t}}
function picHTML(p){if(p.i)return '<img alt="" style="max-height:170px;max-width:100%;border-radius:10px;object-fit:contain" src="'+IMGS[p.i]+'">';
 if(p.d)return '<div style="background:#FFCC00;border-radius:22px;font:900 '+(p.d.length>5?34:p.d.length>3?52:72)+'px/1 Nunito,sans-serif;padding:20px 26px;min-width:140px">'+esc(p.d)+'</div>';
 if(p.s)return '<div style="width:180px;height:110px;border-radius:20px;border:3px solid #B9B4A3;background:'+p.s+'"></div>';
 if(p.x)return '<div style="background:#1C2541;color:#fff;border-radius:18px;font:900 44px Nunito,sans-serif;padding:16px 28px">'+esc(p.x)+'</div>';
 var n=Array.from(p.e.replace(/[️‍]/g,'')).length;return '<div class="emo" style="font-size:'+(n>1?86:120)+'px">'+p.e+'</div>'}
function enHTML(d){var e=d.en.replace(/\*/g,'');return '<div class="en'+(e.length>28?' long':'')+'">'+esc(e)+'</div>'+(d.ipa?'<div class="ipa">'+esc(d.ipa)+'</div>':'')}
function dlgHTML(d){if(!d.dlg)return '';var all=d.dlg.lines.every(function(l){return l[0]});return '<div class="dlg"><div class="dt">'+(all?'💬 课本里的情景对话（点一句听一句）':'📖 课本里的例句（点一句听一句）')+'</div>'+d.dlg.lines.map(function(l){return '<div class="dl'+(l[0]?'':' ns')+'" data-t="'+esc(l[1])+'">'+(l[0]?'<b>'+esc(l[0])+'</b>':'')+'<span class="den">'+esc(l[1])+'</span><span class="dzh">'+esc(l[2])+'</span></div>'}).join('')+'<div class="dsrc">出处：'+esc(d.dlg.src)+'</div></div>'}
function render(){var d=DATA[state.cur];
 $('tag').textContent='Unit '+d.u+' · '+UN[d.u]+' · '+(d.t==='w'?'单词':'固定搭配')+' · '+(MODE==='e2c'?'英译中':'中译英');
 $('pic').innerHTML=d.t==='w'?picHTML(d.p):'<div class="emo" style="font-size:90px">💬</div>';
 $('q').innerHTML=MODE==='e2c'?enHTML(d):'<div class="zh">'+esc(d.zh)+'</div>';
 $('pos').textContent=d.pos||'';$('pos').style.display=d.pos?'inline-block':'none';
 state.shown=false;state.marked=false;drawAns()}
function drawAns(){var a=$('ans'),d=DATA[state.cur];
 if(state.shown){a.className='ans show';a.innerHTML=(MODE==='e2c'?'<div class="zh">'+esc(d.zh)+'</div>':enHTML(d))+dlgHTML(d)}
 else{a.className='ans hide';a.textContent=MODE==='e2c'?'？ 点这里看中文意思':'？ 点这里看英文'}}
function next(){if(TTS)TTS.cancel();if(!state.bag.length)refill();if(!state.bag.length){$('q').textContent='没有题目';return}
 state.last=state.cur;state.cur=state.bag.pop();render()}
function mark(ok){if(!state.marked){state.n++;if(ok)state.ok++;else state.no++;state.marked=true;stat()}
 if(!ok&&!state.shown){state.shown=true;drawAns();return}next()}
function stat(){$('st').textContent='已练 '+state.n+' 题 · 认识 '+state.ok+' · 不认识 '+state.no}
function bar(id,opts,key){var b=$(id);b.innerHTML='';opts.forEach(function(o){var e=document.createElement('button');e.textContent=o[1];e.className=(state[key]===o[0]?'on':'');
