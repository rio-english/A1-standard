店工作，但我们星期五不上班——我去见朋友。"]]}}, {"u": 6, "t": "p", "zh": "在六点 · 在上午 · 在每个星期一 · 在夜里", "pos": "", "en": "at six o’clock · in the morning · on Mondays · at night", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6a p.71 · 课文 A night in Chile（录音 6.5，阅读短文，非对话）", "made": false, "lines": [["Sara", "I start work at nine o’clock at night.", "我晚上九点开始工作。"], ["Sara", "I finish work at two thirty in the morning and I go home and go to bed.", "我凌晨两点半下班，然后回家睡觉。"], ["Sara", "They don’t go to school on Saturday and Sunday.", "他们星期六和星期天不上学。"]]}}, {"u": 6, "t": "p", "zh": "你吃肉吗？— 吃。/ 不吃。", "pos": "", "en": "Do you eat meat? — Yes, I do. / No, I don’t.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6b p.72 · 录音 6.8 对话 2（菲律宾街头小吃）", "made": false, "lines": [["Presenter", "Aha. Do you eat turon every day?", "啊哈。你每天都吃香蕉春卷吗？"], ["Woman", "No, I don’t. I don’t buy them at the weekend.", "不，不是。周末我不买。"]]}}, {"u": 6, "t": "p", "zh": "我喜欢鱼，但我朋友不喜欢（它）。", "pos": "", "en": "I like fish, but my friend doesn’t like it.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6b p.73 · 练习 10 + 练习 11 句 1、4（宾格代词，答案句，非对话）", "made": false, "lines": [["", "I like champorado. I have it for lunch.", "我喜欢巧克力米粥，我午饭吃它。"], ["", "I love vegetables. I eat them every day.", "我很爱吃蔬菜，我每天都吃。"], ["", "This is my favourite café. I love it.", "这是我最喜欢的咖啡馆，我很喜欢它。"]]}}, {"u": 6, "t": "p", "zh": "你住在哪里？— 我住在迪拜。", "pos": "", "en": "Where do you live? — I live in Dubai.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "语法练习工作纸 Grammar Practice 6c · 练习 1 第 9 题（答案 a）", "made": false, "lines": [["A", "Where do you live?", "你住在哪里？"], ["B", "In Singapore.", "在新加坡。"]]}}, {"u": 6, "t": "p", "zh": "你冬天做什么？— 我待在家里。", "pos": "", "en": "What do you do in winter? — I stay at home.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6c p.75 · 课文 Season to season（录音 6.12，阅读短文，非对话）", "made": false, "lines": [["", "Where do people go in winter?", "人们冬天去哪里？"], ["", "In winter, it’s cold, foggy and snowy too. A lot of people stay at home.", "冬天很冷，有雾，还下雪。很多人待在家里。"], ["", "They watch TV, read books and cook winter food.", "他们看电视、看书，做冬天吃的饭菜。"]]}}, {"u": 6, "t": "p", "zh": "怎么了？— 我饿了 / 累了 / 冷。", "pos": "", "en": "What’s the matter? — I’m hungry / tired / cold.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6d p.76 · 录音 6.16", "made": false, "lines": [["Mother", "What’s the matter, Anna?", "怎么了，安娜？"], ["Anna", "I’m bored.", "我好无聊。"]]}}, {"u": 6, "t": "p", "zh": "我不舒服。", "pos": "", "en": "I don’t feel well.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6d p.76 · 录音 6.16", "made": false, "lines": [["Father", "Paul, are you OK?", "保罗，你还好吗？"], ["Paul", "No, I’m not. I don’t feel well. I’m ill.", "不太好。我不舒服，我病了。"], ["Mother", "You’re probably hungry. Why don’t you eat a sandwich?", "你可能是饿了。吃个三明治吧？"]]}}, {"u": 6, "t": "p", "zh": "你喝杯茶吧？（提建议）", "pos": "", "en": "Why don’t you have a cup of tea?", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6d p.76 · 录音 6.16", "made": false, "lines": [["Mother", "What’s the matter?", "怎么了？"], ["Father", "It’s cold and I’m thirsty.", "天很冷，我又渴了。"], ["Mother", "Why don’t you have a cup of tea? Here you are.", "喝杯茶吧？给你。"]]}}, {"u": 6, "t": "p", "zh": "你最喜欢哪个季节？", "pos": "", "en": "What’s your favourite season?", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6c p.74 · 练习 12 对话示例", "made": false, "lines": [["A", "What’s your favourite season?", "你最喜欢哪个季节？"], ["B", "My favourite season is winter.", "我最喜欢冬天。"], ["A", "Why do you like winter?", "你为什么喜欢冬天？"]]}}, {"u": 6, "t": "p", "zh": "天气晴朗 / 下雨 / 冷。", "pos": "", "en": "It’s sunny / rainy / cold.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6c p.74 · 录音 6.11（四个地方的人谈天气）", "made": false, "lines": [["Speaker 1", "I live in Canada. My favourite time of year is winter. It’s cold, foggy and snowy.", "我住在加拿大。我一年中最喜欢冬天。天气冷，有雾，还下雪。"], ["Speaker 2", "I live in the south of Mexico. I like the rainy season. It isn’t cold.", "我住在墨西哥南部。我喜欢雨季，天气不冷。"], ["Speaker 3", "I live in Japan. Spring is the best season. The weather is sunny and dry.", "我住在日本。春天是最好的季节，天气晴朗干爽。"]]}}, {"u": 6, "t": "p", "zh": "夏天从五月到九月。", "pos": "", "en": "Summer is from May to September.", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 开篇 p.69 · 录音 6.1（介绍格陵兰照片，非对话）", "made": false, "lines": [["", "Greenland has two seasons, summer and winter.", "格陵兰有两个季节：夏天和冬天。"], ["", "Summer has five months. It’s from May to September.", "夏天有五个月，从五月到九月。"], ["", "Winter is long. It’s from October to April.", "冬天很长，从十月到四月。"]]}}, {"u": 6, "t": "p", "zh": "去海滩 · 回家 · 去游泳 · 去散步", "pos": "", "en": "go to the beach · go home · go swimming · go for a walk", "ipa": "", "p": {"e": "💬"}, "dlg": {"src": "课本 6d p.76 · 录音 6.16（Anna 和妈妈）", "made": false, "lines": [["Anna", "I’m bored.", "我好无聊。"], ["Mother", "Why don’t you go to the beach? Go swimming.", "你去海滩吧？去游个泳。"], ["Anna", "In the rain?!? Mum!", "下着雨去？！妈！"]]}}],IMGS={"u1:book": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCACpAUEDASIAAhEBAxEB/8QAGwAAAgIDAQAAAAAAAAAAAAAAAAECBgMFBwT/xAA2EAACAQMDAwMDAwMDAwUAAAAAAQIDBBEFEiEGMUETUWEiQnEyUoEHFCNikdFyocEWM5Lw8f/EABoBAQADAQEBAAAAAAAAAAAAAAABAwQFAgb/xAApEQACAgICAgIBBAIDAAAAAAAAAQIDBBEhMQUiEkEyExRRcSNCJDNS/9oADAMBAAIRAxEAPwDuIAJgDAQEAYCBEgGRm1gb7kKraXAALHyGPkxSqxgvrqRR56uqWdHmpcQX5aPDnGPbParlLpHu/kbzgr9z1TptFv8AzbmvETVXHXNCKf8Ab0JyfyVyya19l8MK+fUS5ScvcW593JHObjrW8nJqEIwXya2v1Hqddtf3Div9PBTLOhHo1Q8PdLs6pVuqNP8AXUS/k191r2nUf13EP4Zyute3NbPrV6k/y8mByb/BRLP/AINtfg1/uzo9x1pY001SUpteyNTcdc1cP0KEV+WU7Ice5mnmWM2w8VRH6LFU6v1Ko21OEU/CiO06v1CjNOs41I+YqOCuCfJWsqz+S9+Px2taOm6V1VY3rUHL0qnmMuxYqdWM47oSUs+zOHfVk2Wn69qFi4qhWbgvtm+DZVna4kczJ8Ku6mdhTkxxfzkpOldb0ZtQvoOm33ki1Wl/a3Md9vVjNP2ZvhfGa4OLbiW0vUke8eDHF/n4yTbx/BcZ+hoZFMaYAwECAGAAAAAAAAAAAAAAAAAAAAAEG2iO6XfjBJ9manXb+tYWnqUqTqfg8yl8Vs9Ri5PSNm6mPuRindQgszqRivlnOb7qbUK0WqclT+F4NHc391Wl/lr1JfmRiszox4R1qfETs52dWuNdsbdf5LiH8M1Vz1vp9Jf49038I5s5bu+f9w/kyT8hM31+GqX5Mul11
