var UN = {"7": "Work and study 工作与学习"};
var state = {u: 0, t: 'a', bag: [], cur: null, last: null, shown: false, n: 0, ok: 0, no: 0, marked: false};
function $(id){return document.getElementById(id)}
function pool(){return DATA.map(function(d,i){return i}).filter(function(i){var d=DATA[i];return (state.u===0||d.u===state.u)&&(state.t==='a'||d.t===state.t)})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function refill(){state.bag=shuffle(pool());if(state.bag.length>1&&state.bag[state.bag.length-1]===state.last){var t=state.bag[0];state.bag[0]=state.bag[state.bag.length-1];state.bag[state.bag.length-1]=t}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function picHTML(p){
 if(p.i) return '<img alt="" src="'+IMGS[p.i]+'">';
 if(p.d) return '<div class="dig" style="font-size:'+(p.d.length>5?34:p.d.length>3?52:72)+'px">'+esc(p.d)+'</div>';
 if(p.s) return '<div class="sw" style="background:'+p.s+'"></div>';
 if(p.x) return '<div class="txt">'+esc(p.x)+'</div>';
 var n=Array.from(p.e.replace(/[️‍]/g,'')).length;
 return '<div class="emo'+(n>1?' two':'')+'">'+p.e+'</div>';
}
function render(){
 var d=DATA[state.cur];
 $('tag').textContent='Unit '+d.u+' · '+UN[d.u]+' · '+(d.t==='w'?'单词':'固定搭配');
 $('pic').innerHTML=picHTML(d.p);
 $('zh').textContent=d.zh;
 $('pos').textContent=d.pos;
 $('pos').style.display=d.pos?'inline-block':'none';
 state.shown=false; state.marked=false; drawAns();
}
function drawAns(){
 var a=$('ans'),d=DATA[state.cur];
 if(state.shown){a.className='ans show';a.innerHTML='<div class="en'+(d.en.length>28?' long':'')+'">'+esc(d.en)+'</div>'+(d.ipa?'<div class="ipa">'+esc(d.ipa)+'</div>':'')}
 else{a.className='ans hide';a.textContent='？ 点这里看答案'}
}
function next(){
 if(window.speechSynthesis) window.speechSynthesis.cancel();
 if(!state.bag.length) refill();
 if(!state.bag.length){$('zh').textContent='没有题目';return}
 state.last=state.cur; state.cur=state.bag.pop(); render();
}
function mark(ok){
 if(!state.marked){state.n++; if(ok) state.ok++; else state.no++; state.marked=true; stat()}
 if(!ok&&!state.shown){state.shown=true;drawAns();return}
 next();
}
function stat(){$('st').textContent='已练 '+state.n+' 题 · 认识 '+state.ok+' · 不认识 '+state.no}
function bar(id,opts,key){
 var b=$(id); b.innerHTML='';
 opts.forEach(function(o){var e=document.createElement('button');e.textContent=o[1];e.className=(state[key]===o[0]?'on':'');
  e.onclick=function(){state[key]=o[0];state.bag=[];bar(id,opts,key);next()};b.appendChild(e)});
}
var UO=[[0,'全部']].concat([7].map(function(u){return [u,'Unit '+u]}));
var TO=[['a','全部'],['w','单词'],['p','固定搭配']];
bar('ub',UO,'u'); bar('tb',TO,'t');
$('ans').onclick=function(){state.shown=!state.shown;drawAns()};
$('bnext').onclick=function(){if(!state.marked&&state.shown){} next()};
$('bok').onclick=function(){mark(true)};
$('bno').onclick=function(){mark(false)};
$('rst').onclick=function(){state.n=state.ok=state.no=0;stat()};
// ---- speech: standard American English female voice, slow
var TTS=window.speechSynthesis, VOICE=null;
var PREF=[/aria/i,/jenny/i,/ava/i,/samantha/i,/allison/i,/susan/i,/zira/i,/google us english/i,/female/i,/emma/i,/michelle/i];
function pickVoice(){
 if(!TTS) return;
 var vs=TTS.getVoices().filter(function(v){return /^en[-_]US/i.test(v.lang)});
 VOICE=null;
 for(var k=0;k<PREF.length&&!VOICE;k++){for(var j=0;j<vs.length;j++){if(PREF[k].test(v_name(vs[j]))&&!/guy|david|mark|andrew|brian|christopher|eric|roger|steffan|male\b/i.test(v_name(vs[j]))){VOICE=vs[j];break}}}
 if(!VOICE&&vs.length) VOICE=vs[0];
}
function v_name(v){return v.name+' '+(v.voiceURI||'')}
function speechText(s){
 s=String(s);s=s.replace(/\bMrs\b\.?/g,'Missus').replace(/\bMr\b\.?/g,'Mister').replace(/\bMs\b\.?/g,'Miz').replace(/\bDr\b\.?(?=\s+[A-Z])/g,'Doctor');
 return s.replace(/[　-鿿＀-￯]+/g,' ').replace(/\/[^\/]*[ɪəʊæɑɒɔʃʒθðŋː][^\/]*\//g,' ')
  .replace(/[→+]/g,', ').replace(/\s*\/\s*/g,', ').replace(/…|\.\.\./g,' ').replace(/[\[\]()（）]/g,' ')
  .replace(/·/g,', ').replace(/\s*,\s*(,\s*)+/g,', ').replace(/\s+/g,' ').replace(/\s+([,?.!])/g,'$1')
  .replace(/,([?.!])/g,'$1').replace(/([.?!]),/g,'$1').replace(/^[,\s]+|[,\s]+$/g,'');
}
function speak(){
 if(!TTS||state.cur===null) return;
 var b=$('spk'); TTS.cancel();
 var u=new SpeechSynthesisUtterance(speechText(DATA[state.cur].en));
 u.lang='en-US'; if(VOICE) u.voice=VOICE; u.rate=0.7; u.pitch=1.05;
 u.onstart=function(){b.className='spk play'}; u.onend=u.onerror=function(){b.className='spk'};
 TTS.speak(u);
}
if(TTS){pickVoice(); if(TTS.onvoiceschanged!==undefined) TTS.onvoiceschanged=pickVoice}
else{$('spk').disabled=true;$('spk').title='此浏览器不支持朗读'}
$('spk').onclick=function(e){e.stopPropagation();speak()};
document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();$('ans').click()}else if(e.key==='Enter'||e.key==='ArrowRight'){if(TTS)TTS.cancel();next()}else if(e.key==='s'||e.key==='S'){speak()}});
window.__speechText=speechText;
next();
document.body.setAttribute('data-ready', DATA.length);
